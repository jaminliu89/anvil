<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anvil — Local AI Workstation Vision</title>
<style>
:root {
  --canvas: #F4F1EA;
  --surface: #FAF8F3;
  --raised: #FFFDF8;
  --line: #D9D4CA;
  --ink: #181816;
  --ink2: #3C3B37;
  --ink3: #706D65;
  --ink4: #9A968C;
  --signal: #655D52;
  --signalSoft: #ECE7DE;
  --success: #50634F;
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-base: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;
  --fs-3xl: 2.25rem;
  --fs-4xl: 3rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2.5rem;
  --space-2xl: 4rem;
  --radius-surface: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--canvas);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.6;
}
.container { max-width: 920px; margin: 0 auto; padding: 0 var(--space-lg); }
section { padding: var(--space-2xl) 0; border-bottom: 1px solid var(--line); }
h1 { font-size: var(--fs-4xl); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: var(--fs-2xl); font-weight: 600; margin-bottom: var(--space-md); }
.subtitle { font-size: var(--fs-lg); color: var(--ink3); }
.label { font-size: var(--fs-xs); color: var(--ink4); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: var(--space-sm); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-lg); }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-surface);
  padding: var(--space-lg);
}
.card-title { font-size: var(--fs-lg); font-weight: 600; margin-bottom: var(--space-sm); }
.card-desc { font-size: var(--fs-sm); color: var(--ink3); }
</style>
</head>
<body>

<section>
  <div class="container">
    <div class="label">Product Manager Vision</div>
    <h1>Anvil</h1>
    <p class="subtitle">Anvil 把三个东西集成到一个桌面里：推理、微调、 Agent 编排。</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="label">Parchment Design System</div>
    <h2>视觉重构宗旨</h2>
    <div class="grid">
      <div class="card">
        <div class="card-title">安静科技 (Quiet Technology)</div>
        <div class="card-desc">使用暖纸色调（Warm Paper `#F4F1EA`），克制无噪点，摒弃发光与高饱和度蓝/紫，专注高效率工作。</div>
      </div>
      <div class="card">
        <div class="card-title">零术语体验 (Zero Terminology)</div>
        <div class="card-desc">用黑盒化与隐喻替换底层的专业术语：用“大脑”代替“Endpoint”，用“发散度”代替“Temperature”。</div>
      </div>
    </div>
  </div>
</section>

</body>
</html>
