<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anvil — 本地 AI 工作站 (Parchment Prototype)</title>
<style>
:root {
  --canvas: #F4F1EA;
  --surface: #FAF8F3;
  --raised: #FFFDF8;
  --line: #D9D4CA;
  --ink: #181816;
  --ink2: #3C3B37;
  --ink3: #706D65;
  --ink4: #9A968C;
  --signal: #655D52;
  --signalSoft: #ECE7DE;
  --success: #50634F;
  --warning: #806544;
  --error: #7A5049;
  --radius-sm: 6px;
  --radius: 9px;
  --radius-lg: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  background: var(--canvas);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.layout { display:flex; height:100vh; }

/* ---- Sidebar ---- */
.sidebar {
  width: 210px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:16px 12px;
  flex-shrink:0;
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 8px 16px 8px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}
.brand-icon {
  width:32px;height:32px;
  background:var(--signal);
  border-radius:var(--radius-sm);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--raised);
  font-weight:700;
  font-size:15px;
}
.brand-text { font-size:15px;font-weight:700;color:var(--ink); }
.brand-sub { font-size:11px;color:var(--ink3); }

.nav { display:flex;flex-direction:column;gap:3px;flex:1; }
.nav-btn {
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;color:var(--ink3);
  cursor:pointer;transition:all .12s;border:none;background:none;text-align:left;width:100%;
}
.nav-btn:hover { background:var(--signalSoft);color:var(--ink); }
.nav-btn.active { background:var(--signal);color:var(--raised); }

.sidebar-bottom { margin-top:auto;padding-top:12px;border-top:1px solid var(--line); }
.sidebar-status {
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;font-size:12px;color:var(--ink3);
}
.status-dot {
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
}
.status-dot.on { background:var(--success); }

/* ---- Main ---- */
.main { flex:1;overflow-y:auto;padding:28px 36px; }

/* ---- Cards ---- */
.card {
  background:var(--raised);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:20px;
  margin-bottom:16px;
  box-shadow: 0 1px 3px rgba(24,24,22,0.05);
}
.card-title {
  font-size:14px;font-weight:600;color:var(--ink2);
  margin-bottom:12px;
}

/* ---- Sliders ---- */
.slider-group { display:flex;flex-direction:column;gap:14px; }
.slider-row { display:flex;align-items:center;gap:12px; }
.slider-label { font-size:13px;font-weight:500;color:var(--ink2);min-width:80px; }
.slider-track { flex:1;height:6px;background:var(--line);border-radius:3px;position:relative; }
.slider-fill { height:100%;background:var(--signal);border-radius:3px;position:absolute;left:0;top:0; }
.slider-value { font-size:13px;font-weight:600;color:var(--ink);min-width:60px;text-align:right; }

/* ---- Actions ---- */
.btn {
  padding:6px 14px;border-radius:var(--radius-sm);
  font-size:12px;font-weight:500;border:1px solid var(--line);
  background:var(--raised);color:var(--ink2);cursor:pointer;
}
.btn-primary { background:var(--signal);color:var(--raised);border-color:var(--signal); }
</style>
</head>
<body>

<div class="layout">
<div class="sidebar">
  <div class="brand">
    <div class="brand-icon">A</div>
    <div>
      <div class="brand-text">Anvil</div>
      <div class="brand-sub">本地 AI 工作站</div>
    </div>
  </div>
  <div class="nav">
    <button class="nav-btn active">对话</button>
    <button class="nav-btn">AI 引擎</button>
    <button class="nav-btn">训练工坊</button>
    <button class="nav-btn">连接</button>
    <button class="nav-btn">守卫</button>
    <button class="nav-btn">设置</button>
  </div>
  <div class="sidebar-bottom">
    <div class="sidebar-status">
      <span class="status-dot on"></span> 大脑就绪
    </div>
  </div>
</div>

<div class="main">
  <div style="margin-bottom:20px">
    <h1 style="font-size:22px;font-weight:700;color:var(--ink)">Anvil 工作站</h1>
    <p style="font-size:13px;color:var(--ink3)">基于 Parchment 暖纸设计系统的全新桌面体验</p>
  </div>

  <div class="card">
    <div class="card-title">大脑状态</div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:16px;font-weight:600">Ling 3.0 Tiny</div>
        <div style="font-size:12px;color:var(--ink3)">本地轻量主力模型 · 全 GPU Offload</div>
      </div>
      <button class="btn btn-primary">重启引擎</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">智能调节</div>
    <div class="slider-group">
      <div class="slider-row">
        <span class="slider-label">思考能力</span>
        <div class="slider-track"><div class="slider-fill" style="width:85%"></div></div>
        <span class="slider-value">深度推演</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">内存上限</span>
        <div class="slider-track"><div class="slider-fill" style="width:50%"></div></div>
        <span class="slider-value">8 GB</span>
      </div>
    </div>
  </div>
</div>
</div>

</body>
</html>
